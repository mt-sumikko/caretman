<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>モーション確認・精査</title>
    <!-- 開発用の確認ページなので検索エンジンに載せない -->
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
  </head>
  <body>
    <h1>棒人間モーション確認・精査</h1>
    <p class="note">
      実エディタと同じ計算(<code>src/pose.ts</code>)をそのまま使って、各モーションを単体で繰り返し再生する確認用ページ。
      <code>src/pose.ts</code>を調整すると、ここと実エディタの両方に反映される。
    </p>

    <div class="layout">
      <div class="stage-card">
        <div class="stage">
          <span class="size-ref" id="size-ref-left" aria-hidden="true">あ</span>
          <div class="figure" id="figure">
            <svg viewBox="-30 -70 60 100">
              <defs>
                <!-- マスクとテクスチャの範囲の理由はindex.htmlの同じ箇所のコメント参照 -->
                <mask
                  id="pencil-mask"
                  maskUnits="userSpaceOnUse"
                  x="-30"
                  y="-70"
                  width="60"
                  height="100"
                  maskContentUnits="userSpaceOnUse"
                >
                  <rect x="-30" y="-70" width="60" height="100" fill="#fff" />
                  <image
                    href="/textures/pencil-grain-placeholder.webp"
                    x="-30"
                    y="-70"
                    width="60"
                    height="100"
                    preserveAspectRatio="xMidYMid slice"
                    opacity="0.5"
                  />
                </mask>
              </defs>
              <g id="clean-group">
                <path class="stroke" id="p-head" d=""></path>
                <path class="stroke" id="p-body" d=""></path>
                <path class="stroke" id="p-arms" d=""></path>
                <path class="stroke" id="p-legs" d=""></path>
              </g>
              <g id="rough-group" mask="url(#pencil-mask)"></g>
            </svg>
          </div>
          <span class="size-ref" id="size-ref-right" aria-hidden="true">愛</span>
        </div>
        <div class="controls">
          <div class="control-row">
            <label for="scale">サイズ</label>
            <input type="range" id="scale" min="1" max="8" step="0.5" value="4" />
            <output id="scale-out">4.0</output>
          </div>
          <div class="control-row">
            <label for="texture">rough.js+鉛筆テクスチャ</label>
            <input type="checkbox" id="texture" checked />
          </div>
          <div class="control-row">
            <label for="boil">line boil(常時ゆらぎ)</label>
            <input type="checkbox" id="boil" checked />
          </div>
        </div>
      </div>

      <div class="picker" id="picker"></div>

      <section class="gallery" aria-labelledby="gallery-title">
        <h2 id="gallery-title">モーション図鑑</h2>
        <p class="gallery-note">
          各モーションを一定間隔で切り出したコマ送り。開くたびに実際のモーションの計算から描いているので、調整するとここも自動で最新になる。
        </p>
        <div class="filmstrips" id="filmstrips"></div>
      </section>
    </div>

    <script type="module" src="/src/motionReview/main.ts"></script>
  </body>
</html>
