<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>モーション確認・精査</title>
  </head>
  <body>
    <h1>棒人間モーション確認・精査</h1>
    <p class="note">
      実エディタ(<code>src/pose.ts</code> / <code>src/editor.ts</code>)とは独立したページ。ここでの調整が固まったら、
      キューをもらってから実エディタ側に反映する運用。
    </p>

    <div class="layout">
      <div class="stage-card">
        <div class="stage">
          <div class="figure" id="figure">
            <svg viewBox="-20 -44 40 60">
              <defs>
                <mask id="pencil-mask" maskContentUnits="userSpaceOnUse">
                  <image
                    href="/textures/pencil-grain-placeholder.png"
                    x="-20"
                    y="-44"
                    width="40"
                    height="60"
                    preserveAspectRatio="none"
                  />
                </mask>
              </defs>
              <g id="clean-group">
                <path class="stroke" id="p-head" d=""></path>
                <path class="stroke" id="p-body" d=""></path>
                <path class="stroke" id="p-arms" d=""></path>
                <path class="stroke" id="p-legs" d=""></path>
              </g>
              <g id="rough-group" mask="url(#pencil-mask)"></g>
            </svg>
          </div>
        </div>
        <div class="controls">
          <div class="control-row">
            <label for="scale">サイズ</label>
            <input type="range" id="scale" min="1" max="8" step="0.5" value="4" />
            <output id="scale-out">4.0</output>
          </div>
          <div class="control-row">
            <label for="texture">rough.js+鉛筆テクスチャ</label>
            <input type="checkbox" id="texture" checked />
          </div>
          <div class="control-row">
            <label for="boil">line boil(常時ゆらぎ)</label>
            <input type="checkbox" id="boil" checked />
          </div>
        </div>
      </div>

      <div class="picker" id="picker"></div>
    </div>

    <script type="module" src="/src/motionReview/main.ts"></script>
  </body>
</html>
