<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>キャレット棒人間エディタ</title>
  </head>
  <body>
    <div class="page">
      <header class="toolbar">
        <button class="dl-btn" id="btn-dl-txt" type="button">.txt</button>
        <button class="dl-btn" id="btn-dl-md" type="button">.md</button>
      </header>

      <div class="content">
        <div class="editor-wrap" id="wrap">
          <div class="editor" id="editor" contenteditable="true" spellcheck="false"></div>
          <div class="figure" id="figure">
            <svg viewBox="-20 -44 40 60">
              <defs>
                <mask id="pencil-mask" maskContentUnits="userSpaceOnUse">
                  <image
                    href="/textures/pencil-grain-placeholder.png"
                    x="-20"
                    y="-44"
                    width="40"
                    height="60"
                    preserveAspectRatio="none"
                  />
                </mask>
              </defs>
              <g id="clean-group">
                <path class="stroke" id="p-head" d=""></path>
                <path class="stroke" id="p-body" d=""></path>
                <path class="stroke" id="p-arms" d=""></path>
                <path class="stroke" id="p-legs" d=""></path>
              </g>
              <g id="rough-group" mask="url(#pencil-mask)"></g>
            </svg>
          </div>
        </div>
      </div>

      <button class="menu-btn" id="btn-menu" type="button" aria-label="メニュー" aria-expanded="false" aria-controls="menu-panel">
        <svg width="28" height="28" viewBox="0 -960 960 960" fill="currentColor" aria-hidden="true">
          <path
            d="M249.23-420q-24.75 0-42.37-17.63-17.63-17.62-17.63-42.37 0-24.75 17.63-42.37Q224.48-540 249.23-540q24.75 0 42.38 17.63 17.62 17.62 17.62 42.37 0 24.75-17.62 42.37Q273.98-420 249.23-420ZM480-420q-24.75 0-42.37-17.63Q420-455.25 420-480q0-24.75 17.63-42.37Q455.25-540 480-540q24.75 0 42.37 17.63Q540-504.75 540-480q0 24.75-17.63 42.37Q504.75-420 480-420Zm230.77 0q-24.75 0-42.38-17.63-17.62-17.62-17.62-42.37 0-24.75 17.62-42.37Q686.02-540 710.77-540q24.75 0 42.37 17.63 17.63 17.62 17.63 42.37 0 24.75-17.63 42.37Q735.52-420 710.77-420Z"
          />
        </svg>
      </button>

      <aside class="menu-panel" id="menu-panel" hidden>
        <div class="menu-dl-row">
          <button class="menu-dl-btn" id="menu-dl-txt" type="button">
            <!-- 仮のダウンロードアイコン。Figma側の正式なSVGに差し替え予定 -->
            <svg class="menu-dl-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 4v10" />
              <path d="M7 10l5 5 5-5" />
              <path d="M5 19h14" />
            </svg>
            .txt
          </button>
          <button class="menu-dl-btn" id="menu-dl-md" type="button">
            <svg class="menu-dl-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 4v10" />
              <path d="M7 10l5 5 5-5" />
              <path d="M5 19h14" />
            </svg>
            .md
          </button>
        </div>
        <hr class="menu-divider" />
        <div class="menu-info">
          <p class="menu-title">caretman</p>
          <p class="menu-desc">動く棒人間と一緒に書けるエディタ</p>
          <a class="menu-github" href="https://github.com/mt-sumikko/caretman" target="_blank" rel="noopener">Github</a>
        </div>
        <button class="menu-close" id="btn-menu-close" type="button" aria-label="閉じる">
          <svg width="28" height="28" viewBox="0 -960 960 960" fill="currentColor" aria-hidden="true">
            <path
              d="M280-120q-17 0-28.5-11.5T240-160q0-17 11.5-28.5T280-200h400q17 0 28.5 11.5T720-160q0 17-11.5 28.5T680-120H280Z"
            />
          </svg>
        </button>
      </aside>
    </div>

    <div class="autosave-notice" id="autosave-notice" hidden>入力内容はこのブラウザに自動保存されます</div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
