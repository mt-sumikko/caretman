<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>caretman | 動く棒人間キャレット</title>
    <meta
      name="description"
      content="文字を打つときにチカチカしてる棒の人間のあそび。今日も元気に入力待ち〜"
    />
    <meta name="theme-color" content="#faf8f3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1c1b18" media="(prefers-color-scheme: dark)" />

    <!-- アイコン(素材はpublic/に置く: favicon.ico=32x32 / apple-touch-icon.png=180x180) -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!--
      SNSシェア用(OGP / X)。%VITE_SITE_URL% はビルド時に .env の VITE_SITE_URL(公開URL)に置き換わる。
      og:image や og:url は https:// から始まる絶対URLでないとSNS側に読んでもらえないため
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="caretman" />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:title" content="caretman | 動く棒人間キャレット" />
    <meta
      property="og:description"
      content="文字を打つときにチカチカしてる棒の人間のあそび。今日も元気に入力待ち〜"
    />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/ogp.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="文字の横で入力待ちをする棒人間のキャレット" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="caretman | 動く棒人間キャレット" />
    <meta
      name="twitter:description"
      content="文字を打つときにチカチカしてる棒の人間のあそび。今日も元気に入力待ち〜"
    />
    <meta name="twitter:image" content="%VITE_SITE_URL%/ogp.png" />
    <meta name="twitter:image:alt" content="文字の横で入力待ちをする棒人間のキャレット" />
  </head>
  <body>
    <div class="page">
      <header class="toolbar">
        <button class="dl-btn" id="btn-dl-txt" type="button">.txt</button>
        <button class="dl-btn" id="btn-dl-md" type="button">.md</button>
      </header>

      <div class="content">
        <div class="editor-wrap" id="wrap">
          <div
            class="editor"
            id="editor"
            contenteditable="true"
            spellcheck="false"
            role="textbox"
            aria-multiline="true"
            aria-label="本文"
          ></div>
          <div class="figure" id="figure" aria-hidden="true">
            <svg viewBox="-30 -70 60 100">
              <defs>
                <!--
                  maskUnits/x/y/width/heightを明示して固定範囲にしている。
                  これを指定しないとmaskUnitsはデフォルトのobjectBoundingBox(=マスク対象要素
                  である#rough-groupの「現在の描画内容の外接ボックス」基準)になり、ジャンプ中
                  など棒人間の姿勢が大きく動いて外接ボックスが変化すると、マスク範囲が動いた分
                  だけ頭などがマスク範囲からはみ出て見えなくなる不具合が起きていた。
                  範囲はviewBoxと同じ(-30 -70 60 100)。ジャンプの頂点では頭がy≒-58まで上がり、
                  放り投げの腕はx≒±22まで出るので、それも覆える広さにしてある。
                  鉛筆テクスチャ画像もこの範囲全体に敷く(縦横比を保ったまま覆うslice)。画像の範囲が
                  狭いと、その外側は「テクスチャなし=真っ黒な線」になり、ジャンプで頭が境目をまたいだ時に
                  濃さの差が横線のように見えてしまうため。本番のテクスチャ画像は横3:縦5の比率で作るとよい。
                  白いrectの上に画像をopacity 0.5で重ねているのは、ざらつき(線が透ける部分)の効き具合を半分に
                  抑えるため。そのままだと文字サイズくらいまで縮んだ時に線全体が薄いグレーに見えてしまう。
                  もっと濃く/かすれさせたい時はこのopacityを上げ下げする(1=画像そのまま、0=ざらつきなし)。
                -->
                <mask
                  id="pencil-mask"
                  maskUnits="userSpaceOnUse"
                  x="-30"
                  y="-70"
                  width="60"
                  height="100"
                  maskContentUnits="userSpaceOnUse"
                >
                  <rect x="-30" y="-70" width="60" height="100" fill="#fff" />
                  <image
                    href="/textures/pencil-grain-placeholder.png"
                    x="-30"
                    y="-70"
                    width="60"
                    height="100"
                    preserveAspectRatio="xMidYMid slice"
                    opacity="0.5"
                  />
                </mask>
              </defs>
              <g id="clean-group">
                <path class="stroke" id="p-head" d=""></path>
                <path class="stroke" id="p-body" d=""></path>
                <path class="stroke" id="p-arms" d=""></path>
                <path class="stroke" id="p-legs" d=""></path>
              </g>
              <g id="rough-group" mask="url(#pencil-mask)"></g>
            </svg>
          </div>
        </div>
      </div>

      <!-- SPのみ表示。navigator.share非対応環境ではダウンロードアイコンのボタン(直下にドロップダウンを開く) -->
      <button class="sp-dl-btn" id="sp-dl-btn" type="button" aria-label="ダウンロード" aria-expanded="false" aria-controls="sp-dl-panel">
        <svg viewBox="0 -960 960 960" fill="currentColor" aria-hidden="true">
          <path
            d="M466.54-345.85q-6.23-2.3-11.85-7.92L330.31-478.15q-8.92-8.93-8.81-20.89.12-11.96 8.81-21.27 9.31-9.3 21.38-9.61 12.08-.31 21.39 9L450-444v-306q0-12.77 8.62-21.38Q467.23-780 480-780t21.38 8.62Q510-762.77 510-750v306l76.92-76.92q8.93-8.92 21.19-8.81 12.27.12 21.58 9.42 8.69 9.31 9 21.08.31 11.77-9 21.08L505.31-353.77q-5.62 5.62-11.85 7.92-6.23 2.31-13.46 2.31t-13.46-2.31ZM252.31-180Q222-180 201-201q-21-21-21-51.31v-78.46q0-12.77 8.62-21.38 8.61-8.62 21.38-8.62t21.38 8.62q8.62 8.61 8.62 21.38v78.46q0 4.62 3.85 8.46 3.84 3.85 8.46 3.85h455.38q4.62 0 8.46-3.85 3.85-3.84 3.85-8.46v-78.46q0-12.77 8.62-21.38 8.61-8.62 21.38-8.62t21.38 8.62q8.62 8.61 8.62 21.38v78.46Q780-222 759-201q-21 21-51.31 21H252.31Z"
          />
        </svg>
      </button>
      <div class="sp-dl-panel" id="sp-dl-panel" hidden>
        <button class="sp-dl-row" id="sp-dl-txt" type="button">.txtをダウンロード</button>
        <hr class="sp-dl-divider" />
        <button class="sp-dl-row" id="sp-dl-md" type="button">.mdをダウンロード</button>
      </div>

      <footer class="footer">
        <a
          class="footer-link"
          href="https://github.com/mt-sumikko/caretman"
          target="_blank"
          rel="noopener"
          aria-label="caretmanのGitHubリポジトリ(別タブで開きます)"
          >caretman</a
        >
      </footer>
    </div>

    <div class="autosave-notice" id="autosave-notice" role="status" hidden>入力内容はこのブラウザに自動保存されます</div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
