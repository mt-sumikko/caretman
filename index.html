<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>キャレット棒人間エディタ</title>
  </head>
  <body>
    <div class="page">
      <header class="toolbar">
        <button class="dl-btn" id="btn-dl-txt" type="button">.txt</button>
        <button class="dl-btn" id="btn-dl-md" type="button">.md</button>
      </header>

      <div class="content">
        <div class="editor-wrap" id="wrap">
          <div class="editor" id="editor" contenteditable="true" spellcheck="false"></div>
          <div class="figure" id="figure">
            <svg viewBox="-20 -44 40 60">
              <defs>
                <mask id="pencil-mask" maskContentUnits="userSpaceOnUse">
                  <image
                    href="/textures/pencil-grain-placeholder.png"
                    x="-20"
                    y="-44"
                    width="40"
                    height="60"
                    preserveAspectRatio="none"
                  />
                </mask>
              </defs>
              <g id="clean-group">
                <path class="stroke" id="p-head" d=""></path>
                <path class="stroke" id="p-body" d=""></path>
                <path class="stroke" id="p-arms" d=""></path>
                <path class="stroke" id="p-legs" d=""></path>
              </g>
              <g id="rough-group" mask="url(#pencil-mask)"></g>
            </svg>
          </div>
        </div>
      </div>

      <!-- SPのみ表示。ダウンロードアイコンのボタン(押すと直下にドロップダウンを開く) -->
      <button class="sp-dl-btn" id="sp-dl-btn" type="button" aria-label="ダウンロード" aria-expanded="false" aria-controls="sp-dl-panel">
        <!-- 仮のダウンロードアイコン。Figma側の正式なSVGに差し替え予定 -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 4v10" />
          <path d="M7 10l5 5 5-5" />
          <path d="M5 19h14" />
        </svg>
      </button>
      <div class="sp-dl-panel" id="sp-dl-panel" hidden>
        <button class="sp-dl-row" id="sp-dl-txt" type="button">.txtをダウンロード</button>
        <hr class="sp-dl-divider" />
        <button class="sp-dl-row" id="sp-dl-md" type="button">.mdをダウンロード</button>
      </div>

      <footer class="footer">
        <a class="footer-link" href="https://github.com/mt-sumikko/caretman" target="_blank" rel="noopener">caretman</a>
      </footer>
    </div>

    <div class="autosave-notice" id="autosave-notice" hidden>入力内容はこのブラウザに自動保存されます</div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
